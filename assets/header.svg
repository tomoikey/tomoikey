<svg width="100%" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1b27"/>
      <stop offset="0.5" stop-color="#414868"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
  </defs>
  <style>
    @font-face {
      font-family: 'Major Mono Display';
      src: url(data:font/woff2;base64,) format('woff2');
